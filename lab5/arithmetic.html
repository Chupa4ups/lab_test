    <script>
        function showSum() {
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value);
            let b = parseInt(inputB.value);
            let result = a + b;
            alert('Сумма '+ a +' и '+ b +' равна ' + result);
        }
        function showAuthor() {
            let author = 'Автор страницы: \nКрюков Василий Александрович'
            alert(author)
        }
        function nizclick() {
            let x = 'Добро пожаловать! \nВы находитесь на тестовой странице'
            alert(x)
        }
    </script>

    <style>
        .message {
            cursor: pointer;
            width: 300px;
            height: 50px;
            background-color: lightblue;
            border: 2px solid black;
            border-radius: 10px;
            margin: 10px;
            text-align: center;
            line-height: 50px;
            background-color: rgb(168, 192, 206);
            display: inline-block;
        }

</head>

<body>
    <header onclick="showAuthor()">
