<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа 7</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon.ico 32x32">
    <link rel="icon" href="../favicon.ico 48x48">
    <script src="dollar-data.js"></script>
    <script>
        function showExchange() {
            // const exchange = [
            //     74.8014, 75.4388, 75.3448, 75.2246, 74.6209, 74.2963, 73.7878, 
            //     73.3420, 73.1385, 73.1275
            // ];
            let table = document.getElementById('dollar-table');    
            for(let i = 0; i < exchange.length; i++) {
                let tr = document.createElement('tr');
                let td = document.createElement('td');
                td.innerText = exchange[i];
                tr.appendChild(td);
                table.appendChild(tr);
            }

            let sum = 0;
            for(let i = 0; i < exchange.length; i++) {
                sum += exchange[i];
            }

            let average = sum / exchange.length;
            average = average.toFixed(2);

            document.getElementById('detail').innerText =
            'Средний курс доллара: ' + average;

            hideButton();
        }
        function hideButton() {
            let button = document.getElementById('dollar-button');
            button.style.display = 'none';
        }
    </script>
</head>

<body>
    <header>
        НГТУ, ФБ, Лабораторная работа 7
    </header>

    <main>
        <button id="dollar-button" onclick="showExchange()">Курс доллара</button>
        <table border="1" id="dollar-table"></table>
        <div id="detail"></div>
    </main>

    <footer>
        &copy;Крюков Василий, ФБИ-41, 2 курс, 2026
    </footer>
</body>
</html>
