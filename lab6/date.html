<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Дата-время</title>
        <link rel="stylesheet" href="../main.css">
        <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
        <link rel="icon" href="../favicon.ico 32x32">
        <link rel="icon" href="../favicon.ico 48x48">
        <style>
            header {
                transition: color 0.5s;
            }
        </style>
        <script>
            function showDate() {
                let out = document.getElementById('current-date');
                let today = new Date();
                out.innerHTML = today.toLocaleString('ru-RU');
            }
            function showDifferent() {
                let out = document.getElementById('different-dates');
                let today = new Date();
                out.innerHTML += `
                    <div>
                        Россия:
                        ${today.toLocaleString('ru-RU')}
                    </div>
                `;
                out.innerHTML += `
                    <div>
                        США:
                        ${today.toLocaleString('en-US')}
                    </div>
                `;
                out.innerHTML += `
                    <div>
                        Франция:
                        ${today.toLocaleString('fr-FR')}
                    </div>
                `;
                out.innerHTML += `
                    <div>
                        Германия:
                        ${today.toLocaleString('de-DE')}
                    </div>
                `;
                out.innerHTML += `
                    <div>
                        Япония:
                        ${today.toLocaleString('ja-JP')}
                    </div>
                `;
            }
            function changeColors() {
                const header = document.getElementsByTagName('header')[0];
                const rgb = `rgb(${Math.random() * 255}, ${Math.random() * 255}, ${Math.random() * 255})`;
                header.style.color = rgb;
            }

            let timerNum;

            function startChangeColors() {
                changeColors();
                timerNum = setInterval(changeColors, 1000);
                document.getElementById('start-btn').disabled = true;
                document.getElementById('stop-btn').disabled = false;
            }
            function stopChangeColors() {
                clearInterval(timerNum);
                document.getElementById('start-btn').disabled = false;
                document.getElementById('stop-btn').disabled = true;
            }
        </script>
    </head>

    <body onload="showDate(); showDifferent()">
        <header>
            НГТУ, ФБ, Лабораторная работа 6
        </header>

        <main>
            <h2>Текущая дата и время</h2>
            <div id="current-date"></div>
            <div id="different-dates"></div>
            <div>
                <button onclick="startChangeColors()" id="start-btn">Старт</button>
                <button onclick="stopChangeColors()" disabled id="stop-btn">Стоп</button>
            </div>
        </main>

        <footer>
            &copy; Крюков Василий, ФБИ-41, 2 курс, 2026
        </footer>
    </body>
</html>
